<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dosis 24/7 | Licorería & Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <style>
    * {
      font-style: normal !important;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffff93;
      color: #000000;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #000000;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 10px;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Animaciones de entrada para el Hero */
    @keyframes heroImageEntry {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(10px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes heroTextEntry {
      0% {
        opacity: 0;
        transform: translateX(-20px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .animate-hero-img {
      animation: heroImageEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    .animate-hero-text {
      animation: heroTextEntry 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    @media (max-width: 768px) {

      .animate-hero-img,
      .animate-hero-text {
        animation-duration: 0.4s;
      }

      .blur-mobile-none {
        filter: none !important;
        backdrop-filter: none !important;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
